[project]
name = "gzip-compression-function"
description = "Knative adapter for the FunctionBench gzip benchmark"
version = "1.0.0"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  "asgiref>=3.8",
  "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]

[tool.pytest.ini_options]
testpaths = ["tests"]
