[project]
name = "dynamic-html-function"
description = "Knative adapter for the SeBS dynamic HTML benchmark"
version = "1.0.0"
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
dependencies = [
  "asgiref>=3.8",
  "flask>=3.0",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]

[tool.pytest.ini_options]
testpaths = ["tests"]
