# Controller-owned operational settings.
#
# These values define how the controller evaluates and verifies a submitted
# intent. They are intentionally separate from the user's IntentFunction,
# which describes what the user wants rather than how the controller runs its
# experiment.

benchmark:
  warmupRequests: 5
  concurrency: 5
  # cAdvisor is scraped every 10s; allow several distinct complete samples.
  durationSeconds: 60
  resourceSampleIntervalSeconds: 1
  resourceWarmupTimeoutSeconds: 90
  minimumResourceSamples: 3
  requestTimeoutSeconds: 10
  deploymentTimeoutSeconds: 180

validation:
  maximumAttempts: 5
  timeoutSeconds: 10
  retryIntervalSeconds: 2

postDeploymentMonitoring:
  intervalSeconds: 10
  windowSize: 10
  minimumSamples: 3
  requestTimeoutSeconds: 5

# Closed-loop remediation is controller policy, not user intent. A violation
# must persist across several overlapping monitoring windows before a fresh
# benchmark/placement run is launched. The cooldown prevents rapid repeated
# runs if no cluster can currently satisfy the intent.
controlLoop:
  enabled: true
  consecutiveViolationWindows: 3
  cooldownSeconds: 120
