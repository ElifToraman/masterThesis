apiVersion: intent.elif.dev/v1
kind: IntentFunction

metadata:
  name: gzip-compression-evaluation-intent-function

spec:
  function:
    name: gzip-compression
    namespace: default
    serviceName: gzip-compression
    version: functionbench-bebda51-v1
    runtime: knative
    image: elif/gzip-compression:v1

  intent:
    targetRef:
      kind: KnativeService
      name: default/gzip-compression

    objectives:
      - name: gzip-compression-p95-latency
        description: Frozen evaluation target from pilot-20260928T155603Z; 20% margin
        operator: "<="
        value: 173
        unit: ms
        measuredBy: benchmark/gzip-compression/p95_warm_latency_ms
        enforcement: soft
