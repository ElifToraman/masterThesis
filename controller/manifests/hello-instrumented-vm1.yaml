apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-instrumented
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60

      nodeSelector:
        workload: serverless

      containers:
        - name: user-container
          image: host.docker.internal:5000/elif/hello-instrumented:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          env:
            - name: CLUSTER_NAME
              value: vm1-cluster

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
